<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f2ea">
<title>Keine Verbindung · clickzauber</title>
<style>
html,body{margin:0;min-height:100%;background:#f5f2ea;color:#241f19;font-family:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
a{color:#255f45}a:hover{color:#2f7d59}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 24px;box-sizing:border-box;text-align:center}
img{width:64px;height:64px;border-radius:16px}
h1{margin:6px 0 0;font-size:22px;letter-spacing:-.01em}
p{margin:0;font-size:16px;line-height:1.55;color:#5f584a;max-width:32ch;text-wrap:pretty}
button{margin-top:8px;min-height:48px;padding:0 22px;border:none;border-radius:12px;background:#2f7d59;color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
button:hover{background:#1f6d4a}
</style>
</head>
<body>
<main>
<img src="/assets/cz-apple-180.png" alt="">
<h1>Keine Verbindung</h1>
<p>clickzauber braucht Internet. Bitte prüfen Sie WLAN oder mobile Daten.</p>
<button type="button" id="neu">Noch einmal versuchen</button>
</main>
<script>
document.getElementById('neu').onclick=function(){ location.reload(); };
addEventListener('online',function(){ location.reload(); });
</script>
</body>
</html>
