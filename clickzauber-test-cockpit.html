    s: 'Barbershop von Ilmir in Lindau: Logo-Intro, Leistungen als runde Kacheln, dann Tag, Uhrzeit und Barbier (Ilmir oder Patriot). Anthrazit mit silbernen Knöpfen wie sein Logo.',
    seite: 'verkaufsslides/inhaltsverzeichnis.html?v=uncles' },
  { id: 'vorschau-24', am: '13.10.2026', b: 'alle', t: 'Vorschau für 24 Stunden',
    s: 'Neuer Schritt in der Kundenakte vor der Erstversendung: Der Interessent bekommt einen Link mit seinem Formular und einem Beispiel-Cockpit. Eine Testanfrage erscheint sofort im Cockpit. Nach 24 Stunden geht der Link nicht mehr.',
    seite: 'vorschau.html?beispiel=1&v=amar' },
  { id: 'pro-gast-spanne', am: '13.10.2026', b: 'alle', t: 'Preis pro Gast und Grundpreis',
    s: 'Im Konfigurator gibt es je Frage den Haken „Preis pro Gast“. Der Preis wird mit der gewählten Gästezahl malgenommen, z. B. 50–100 Gäste × 120 € = 6.000 bis 12.000 €. Am Ende lässt sich ein Grundpreis eintragen, der immer dazukommt.',
    seite: 'verkaufsslides/inhaltsverzeichnis.html?v=test01' },
  { id: 'savoca', am: '13.10.2026', b: 'alle', t: 'Formular für Tenuta Savoca',
    s: 'Nach ihrem Angebot gebaut: Exklusivmiete je nach Wochentag, Trauung im Wald, Menü pro Gast, Zimmer und Extras. Am Ende eine Einschätzung von bis, zzgl. MwSt.',
    seite: 'verkaufsslides/inhaltsverzeichnis.html?v=savoca' },
  { id: 'kosmetik-demo', am: '08.10.2026', b: 'friseur', t: '7-Tage-Demo für Kosmetik: Kate Cosmetics',
    s: 'So sieht Kate ihre Demo: Anfragen für Wimpern, Gelnägel, Ballancer-Kur und Haarpigmentierung, unter Termine ihr ganzes Angebot mit geschätzten Zeiten. „Neues Formular“ führt im Konfigurator gleich zu „Kosmetik, Nägel & Wimpern“.',
    seite: 'clickzauber-cockpit-live.html?demo=1&rahmen=1&branche=kosmetik&probe=Kate%20Cosmetics' },
  { id: 'zeigen-karte', am: '08.10.2026', b: 'friseur', t: '„Zeigen“ klappt die Karte auf',
    s: 'Im Menü „Funktionen“ führte „Zeigen“ bei den E-Mails nur in die Einstellungen. Jetzt klappt es die Karte „Benachrichtigungen“ auf und hebt sie hervor.',
    zeig: function (w) { if (w.czFxMenue) w.czFxMenue.zeigen('mails'); } },
  { id: 'inhaltsverzeichnis', am: '08.10.2026', b: 'friseur', t: 'Inhaltsverzeichnis mit runden Kacheln',
    s: 'Neue Anfrage von Lea Hoffmann: Balayage und Spitzen schneiden bei schulterlangem, lockigem Haar. Im Termin-Blatt steht jede Leistung mit Zuschlag, dazu Waschen & Föhnen, Dauer und 274 € gesamt. Unter Termine → Leistungen & Regeln stellen Sie die Prozente ein.',
    zeig: function (w) { if (w.czFxMenue) w.czFxMenue.zeigen('tm-inhalt'); } },
  { id: 'gesamt-fix', am: '08.10.2026', b: 'friseur', t: 'Gesamtbetrag stimmt wieder',
    s: '28 € + 60 € ergab 2.860 €: Preise aus dem Konfigurator wurden als Text aneinandergehängt. Jetzt rechnen Formular, Server, Kachel und Termin-Blatt mit Zahlen, auch bei schon gespeicherten Anfragen.',
    zeig: function (w) { if (w.czFxMenue) w.czFxMenue.zeigen('auswahl'); } },
  { id: 'auswahl-cockpit', am: '08.10.2026', b: 'friseur', t: 'Alles, was der Kunde gewählt hat, steht im Cockpit',
    s: 'Jede Seite aus dem Konfigurator kommt mit Antwort und Preis an: auf der Kachel (z. B. „Färben + Intensivkur, Föhnen mit Locken · 112 €“), im Termin-Blatt unter „Gewünscht“ mit Gesamtbetrag und in der E-Mail an den Betrieb. Beispiel: Aylin Demir und Tobias Kern.',
    zeig: function (w) { if (w.czFxMenue) w.czFxMenue.zeigen('auswahl'); } },
  { id: 'missionen-kennen', am: '08.10.2026', b: 'alle', t: 'Missionen: erst das Cockpit kennenlernen',
    s: 'Nach der Einrichtung kommt „Cockpit kennenlernen“: automatische E-Mails, dann Grundlagen, Alltag und Profi-Funktionen der eigenen Branche über das Menü „Funktionen“. „Ersten Textbaustein“ gibt es beim Friseur nicht mehr. Vernetzen steht ganz am Schluss und öffnet sich erst mit der ersten echten Anfrage.',
    zeig: function (w) { var b = w.document.getElementById('msn-alle'); if (b) b.click(); } },
  { id: 'preis-gast', am: '08.10.2026', b: 'alle', t: 'Preise für Kunden zeigen oder nicht',
    s: 'Neuer Schalter unter Einstellungen → Funktionen. An: Der Kunde sieht vor dem Absenden Einzelpreise und Gesamtbetrag, auch in seiner Bestätigung. Aus: nur seine Auswahl. Der Betrieb sieht die Preise immer.',
    zeig: function (w) { if (w.czFxMenue) w.czFxMenue.zeigen('preis-gast'); } },
  { id: 'funktionen-menue', am: '08.10.2026', b: 'alle', t: 'Menü „Funktionen“ in jedem Cockpit',
    s: 'Am Handy die Lasche mit der Glühbirne am linken Rand, am Computer „Funktionen“ in der Seitenleiste. Alle Funktionen der Branche, von den Grundlagen bis zu den Profi-Funktionen, je mit „Zeigen“. „Verstanden“ legt eine Funktion in den Reiter „Verstanden“.',
    zeig: function (w) { if (w.czFxMenue) w.czFxMenue.auf(); } },
  { id: 'funktionen', am: '07.10.2026', b: 'friseur', t: 'Funktionen je Betrieb',
    s: 'Einstellungen → „Funktionen“. Jeder Betrieb schaltet aus, was er nicht braucht, etwa Netzwerk oder Missionen. Es verschwindet sofort, ohne Neuladen. Neu für Salons mit Damen und Herren: „Damen, Herren und Kinder getrennt“. Dann steht bei jeder Leistung (Uhrzeit-Termine → Leistungen & Regeln) „Für: Damen, Herren, Kinder“, und das Formular fragt zuerst „Für wen ist der Termin?“.',
    zeig: function (w) { w.show('settings'); setTimeout(function () { var c = w.document.getElementById('fx-card'); if (c) w.scrollTo(0, c.getBoundingClientRect().top + w.pageYOffset - 80); }, 400); } },
  { id: 'demo-ein-formular', am: '07.10.2026', b: 'handwerk', t: '7-Tage-Demo wie beim Interessenten',
    s: 'So sieht ein Interessent seine Demo: nur das Formular seiner Branche mit seinem Betriebsnamen (hier „Elektro Maier“), im Zahnrad als Pilotbetrieb, mit eigenen Leistungen, Vorlagen, Team und Terminen. Andere Branche: in der Adresse branche= ändern. Zurück über das Menü.',
    seite: 'clickzauber-cockpit-live.html?demo=1&rahmen=1&branche=handwerk&probe=Elektro%20Maier' },
  { id: 'handwerk-makler', am: '07.10.2026', b: 'handwerk', t: 'Neue Beispiele: Handwerk & Solar, Makler & Finanzen',
    s: 'Im Menü stehen zwei neue Branchen. Die Anfragen liegen auf der Tafel (Neu, Kontakt, Angebot, Auftrag, Verloren), mit Wiedervorlage für heute, einem online angenommenen Angebot und einem Verschiebe-Wunsch.',
    zeig: function (w) { w.show('leads'); } },
  { id: 'auftrag-beispiele', am: '07.10.2026', b: 'catering', t: 'Food Truck: angenommen, Ausweichtag, verschieben',
    s: 'Im Beispiel stehen jetzt ein online angenommenes Angebot (Familie Yilmaz), ein gewählter Ausweichtag (Jana Roth), ein Verschiebe-Wunsch (Sportverein Allensbach) und eine Wiedervorlage für heute (Kita Sonnenschein).',
    zeig: function (w) { if (w.czAuOeffnen) w.czAuOeffnen('c7'); } },
  { id: 'umbuchen', am: '06.10.2026', b: 'friseur', t: 'Termin umbuchen und Weitere Möglichkeiten',
    s: 'Im Termin-Blatt steht „Termin umbuchen“, darunter klappt „Weitere Möglichkeiten“ auf, jeweils mit einem Satz, was passiert. Bestätigte Termine: nur absagen, umbuchen oder nachfragen, ob es noch passt.',
    zeig: function (w) {
      w.show('zeiten');
      return new Promise(function (ok, nein) {
        var n = 0;
        (function such() {
          var x = w.czZtTermin && w.czZtTermin('s15');
          if (x && w.czSchnellTermin) { w.czSchnellTermin(x); setTimeout(function () { var d = w.document.getElementById('sa-opt'); if (d && !d.hidden) d.open = true; ok(); }, 500); return; }
          if (++n < 40) setTimeout(such, 150); else nein();
        })();
      });
    } },
  { id: 'historie', am: '05.10.2026', b: 'alle', t: 'Historienbuch',
    s: 'Alle Kunden der letzten 30 Tage, die da waren, mit allen Angaben und CSV-Download. Friseur: Reiter neben „Anfragen“. Food Truck: neben „Zugesagt“. Location: neben „Auswertung“.',
    zeig: function (w) { w.czHistorie.oeffnen(); } },
  { id: 'punkte-klein', am: '05.10.2026', b: 'alle', t: 'Punkte werden beim Scrollen klein',
    s: 'Ganz oben wie bisher. Beim Herunterscrollen huscht die Box an den rechten Rand, wird kleiner und zeigt nur noch die Punkte und die Zahl offener Aufgaben, die sanft pulsiert. Ein Tipp öffnet sie wieder, ganz nach oben scrollen macht sie wieder groß.',
    zeig: function (w) {
      w.show('overview');
      setTimeout(function () {
        /* Ist die Seite zu kurz zum Scrollen, hier unten Platz schaffen (nur im Test) */
        /* Am Handy scrollt #app, am Computer das Fenster */
        var a = w.document.getElementById('app');
        if (a && a.scrollHeight > a.clientHeight + 20 && /(auto|scroll)/.test(w.getComputedStyle(a).overflowY)) { a.scrollTo({ top: 600, behavior: 'smooth' }); return; }
        var d = w.document.documentElement;
        if (d.scrollHeight - w.innerHeight < 300) d.style.minHeight = (w.innerHeight + 700) + 'px';
        w.scrollTo({ top: 600, behavior: 'smooth' });
      }, 400);
    } },
  { id: 'kundenkarte', am: '04.10.2026', b: 'friseur', t: 'Kundenkarte',
    s: 'Ein Tipp auf den Namen zeigt alle Besuche: wann, was gemacht wurde, bei wem und ob jemand nicht gekommen ist. Auch im Termin-Blatt („Alle Besuche ansehen“) und unter Stammkunden. Am besten zu sehen bei Deniz Aras und Maria Lehmann.',
    zeig: function (w) { w.show('zeiten'); setTimeout(function () { w.czKundenkarte({ name: 'Deniz Aras', telefon: '0176 1234567' }); }, 500); } },
  { id: 'offline', am: '04.10.2026', b: 'alle', t: 'Ohne Internet',
    s: 'Statt einer leeren Seite erscheint „Keine Verbindung“. Kommt das Netz zurück, lädt die Seite von selbst neu.',
    seite: 'offline.html' },
  { id: 'bestaetigen', am: '03.10.2026', b: 'alle', t: 'Lesen und bestätigen',
    s: 'Auftragsverarbeitungsvertrag, Datenschutzerklärung, Löschfrist und Benachrichtigung zählen erst, wenn sie ganz unten mit Haken bestätigt sind. Dann gibt es Mission und Punkte.',
    zeig: function (w) {
      /* Beispieldaten sind schon bestätigt: für die Vorführung auf offen setzen (es wird nichts gespeichert) */
      var e = w.EIN && w.EIN.einstellungen;
      if (e) { w.EIN.av_aktuell = false; e.av_vertrag_am = null; e.av_vertrag_von = null; e.bestaetigt = {}; }
      try { w.einZeichnen(); } catch (x) {}
      w.show('recht'); setTimeout(function () { w.czBestaetigen('av'); }, 400);
    } },
  { id: 'vortag', am: '03.10.2026', b: 'friseur', t: 'Kunden am Vortag erinnern',
    s: 'Neuer Schalter in den Einstellungen. Wer bis 17 Uhr nicht per WhatsApp erinnert wurde, bekommt die Erinnerung per Mail oder SMS.',
    zeig: function (w, h) { w.show('settings'); return h.markieren('#s-erinnerung'); } },
  { id: 'zwischen', am: '03.10.2026', b: 'alle', t: 'Zwischennachricht an den Gast',
    s: 'Der Schalter heißt jetzt so und sagt klar, dass er nur die Nachricht an den Gast abschaltet. Ihre eigenen Erinnerungen kommen immer.',
    zeig: function (w, h) { w.show('settings'); return h.markieren('#s-nachfassen'); } },
  { id: 'kalender', am: '03.10.2026', b: 'alle', t: 'Kalender verbinden',
    s: 'Termine landen in Google, Outlook oder iCloud. Private Termine im eigenen Kalender sperren das Formular.',
    zeig: function (w, h) { w.show('kalender'); return h.markieren('#abo2-karte'); } },
  { id: 'erinnern', am: '03.10.2026', b: 'catering', t: 'Erinnere mich am …',
    s: 'Im Anfrage-Blatt einen Tag wählen. An diesem Tag kommt ab 8 Uhr eine Erinnerung. Zum Ansehen eine Anfrage öffnen.',
    zeig: function (w) { w.show('leads'); } }
];
/* Nur nach dem Hochladen testbar: braucht den Server, Gast-Seiten mit echtem Link oder die App. */
var SERVER = [
  { id: 's-papierkorb', t: 'Papierkorb für Formulare (21.10.2026)', wie: 'sql/74, GitHub, IONOS. Mit einem Testkonto: Cockpit → Formular → Löschen, Namen eintippen. Das Formular ist von der Website weg, Sie bekommen Push und Mail, die Plattform zeigt „Formular im Papierkorb“. „Zurückholen“ im Cockpit oder in der Kundenakte: alles wieder da, Anfragen auch.' },
  { id: 's-ziehen', t: 'Nach unten ziehen zum Aktualisieren (20.10.2026)', wie: 'IONOS hochladen. Cockpit in der App oder vom Home-Bildschirm öffnen, ganz oben nach unten ziehen und loslassen: Es lädt neu. Im Konfigurator eine Leistung ändern, ziehen: Die Änderung ist noch da, dieselbe Seite ist offen. Im normalen Browser passiert nichts Neues (das macht der Browser selbst).' },
  { id: 's-blockieren', t: 'Personen blockieren (15.10.2026)', wie: 'sql/72, GitHub, IONOS. Im echten Konto selbst eine Anfrage schicken, im Termin „Diese Person blockieren“. Noch eine Anfrage vom selben Handy: Formular sagt „Danke“, im Cockpit kommt nichts an. Leistungen & Regeln → Blockierte Personen → Freigeben.' },
  { id: 's-wimpern', t: 'Wimpern: neues Set, Fotos, Höchstzahl (15.10.2026)', wie: 'GitHub und IONOS hochladen. Bei Kate unter Leistungen & Regeln die Auffüll-Leistungen anhaken (Haken „Auffüllen“), Regeln wählen, Höchstzahl 3, speichern. Im Formular „Auffüllen nach 2 Wochen“, „Vor 5 Wochen oder länger“ wählen: Hinweis „Voraussichtlich ein neues Set“, freie Zeiten für 2 Std. Absenden, im Cockpit Termin öffnen, „Auf neues Set ändern“, WhatsApp-Knopf prüfen, Link öffnen. Vierte Anfrage vom selben Handy: „Schon genug Anfragen“.' },
  { id: 's-zahl', t: 'Zahl auf dem App-Symbol (15.10.2026)', wie: 'sw.js, Cockpit und lib/lead.js, lib/_push.js hochladen. iPhone: clickzauber vom Home-Bildschirm öffnen, Mitteilungen an. App schließen, eine Anfrage schicken: Auf dem Symbol steht die Zahl der neuen Anfragen. Cockpit öffnen, Anfrage annehmen: Zahl sinkt. Die App aus dem App Store zeigt keine Zahl.' },
  { id: 's-bestaetigung-neu', t: 'Neue Bestätigungs-Mail mit Kalender-Knopf (15.10.2026)', wie: 'lib/termine.js hochladen. Im Formular von Test Firma 00 mit eigener Mail buchen, im Cockpit „Annehmen“. Die Mail kommt mit dem Namen des Betriebs als Absender, Logo, Adresse, Termin-Karte und grünem Knopf „In meinen Kalender eintragen“. Knopf am iPhone tippen: Kalender öffnet sich. „Termin ändern“ führt auf die Seite „Ihr Termin“. Danach einmal „Ablehnen“ testen: Knopf „Neuen Termin wählen“.' },
  { id: 's-einladung-meldungen', t: 'Mitteilungen aus der Einladung (10.10.2026)', wie: 'API und Seiten hochladen. Einladungs-Link eines vorgebauten Kontos nach „Ja, verschickt“ im privaten Tab öffnen: Push und Mail „hat den Einladungs-Link geöffnet“, beim nächsten Öffnen mit Zähler. Zugang mit zu kurzem Passwort versuchen: Mitteilung mit Grund, in der Akte steht der Fehlversuch unter „E-Mail und Passwort angelegt“. „Manuel fragen“ antippen und eine Frage schicken: Push und Mail. Dann mit tripi.manu+kate@gmail.com Zugang anlegen, E-Mail bestätigen, Formular ansehen, Home-Bildschirm, eine Anfrage, weiterschicken: jeweils eine Mitteilung. Zum Schluss „Einladung zurücksetzen“.' },
  { id: 's-gastabsage', t: 'Gast sagt ab, Cockpit räumt auf (09.10.2026)', wie: 'Friseur-Formular: Termin anfragen. Im Cockpit „Andere Uhrzeit vorschlagen“, als Gast den Vorschlag annehmen. Dann als Gast über „Absagen oder anderen Tag wünschen“ (Link in der Bestätigung) absagen. Im Cockpit muss der Termin in spätestens 30 Sekunden als abgesagt dastehen, die Anfrage auf „Verloren“, die Zeit wieder frei. Kurzfristig (innerhalb der Absagefrist) bleibt es eine Meldung.' },
  { id: 's-online-test', t: 'Formular online testen, vor dem Verschicken (10.10.2026)', wie: 'API und Seiten hochladen. Plattform → Kundenübersicht → vorgebautes Konto mit Formular → Schritt 2 „Bearbeiten und testen“: Schalter „Formular online testen“ an. „Formular öffnen“ am Handy, eine Anfrage schicken: Sie steht im Cockpit des Kontos, die Bestätigung kommt an Ihre Adresse. Dann „Alles geprüft und getestet?“ abhaken: Formular aus, Test-Anfrage gelöscht, Einschalten nur noch nach der E-Mail-Bestätigung des Kunden. Ohne Server: clickzauber-plattform.html?akten=beispiel → Barber by Becks.' },
  { id: 's-kundenakte', t: 'Kundenübersicht mit Checkliste (09.10.2026)', wie: 'sql/68 einspielen, API und Seiten hochladen. Plattform → Kundenübersicht: Kate Cosmetics steht als vorgemerkt da → „Jetzt vorbauen“. In der Akte: „Bearbeiten und testen“ öffnet das echte Konto in einem neuen Tab, danach „Alles geprüft und getestet?“ abhaken (grau, Haken am Ende). „Per WhatsApp an Kate“ → zurück auf der Plattform „Ja, verschickt“. Öffnet sie den Link, kommt eine Mitteilung, und die Akte hakt den Schritt in spätestens 15 Sekunden ab, ebenso Zugang (E-Mail sichtbar, Passwort nicht), Bestätigung, Live schalten, Home-Bildschirm, Anfragen und Rückmeldung. Ohne Server: clickzauber-plattform.html?akten=beispiel (Knopf „Nächsten Schritt von Kate durchspielen“).' },
  { id: 's-einladung', t: 'Einladungs-Link mit 14 Tagen Test (09.10.2026)', wie: 'sql/67 einspielen, API und Seiten hochladen. Plattform → „+ Konto vorbauen“ (Angaben, Datenschutz-Link) → „Jetzt öffnen“, Formular bauen. Kunden & Zahlen → Konto → „Einladungs-Link“ → auf zweitem Gerät oder privatem Tab öffnen, Zugang mit tripi.manu+kate@gmail.com → Fenster „Testzugang startet“ → „Ihre ersten Schritte“ durchgehen, Anfrage schicken, Rückmeldung senden. Dann beim Konto „In echtes Konto überführen“ (Cockpit zeigt einmal „Konto freigeschaltet“) oder „Einladung zurücksetzen“ (neuer Link, alles Getestete weg). Ohne Server: einladung.html?beispiel=1 (&eingeloest=1), Karte: clickzauber-cockpit-live.html?test=beispiel' },
  { id: 's-live-frei', t: 'Live schalten ohne Tarif', wie: 'Nach dem Hochladen: Testkonto ohne Pilotplatz anlegen, Formular speichern, im Cockpit „Live schalten“. Es kommt keine Tarif-Seite, nur E-Mail-Bestätigung und Datenschutz-Link.' },
  { id: 's-kate-14', t: '14-Tage-Link für Kate Cosmetics', wie: 'Plattform → 7-Tage-Demos → Zugang anlegen: Betrieb „Kate Cosmetics“, Branche „Kosmetik, Nägel & Wimpern“, Laufzeit 14 Tage. Erst an die eigene Nummer schicken und öffnen: oben „Kate Cosmetics“, unter Termine ihr Angebot, im Zahnrad Pilotbetrieb, noch 14 Tage.' },
  { id: 's-inhalt-form', t: 'Formular mit Inhaltsverzeichnis', wie: 'Am Handy verkaufsslides/inhaltsverzeichnis.html öffnen (für Kate: ?v=kosmetik&betrieb=Kate%20Cosmetics). Tag, Damen, Balayage und Spitzen schneiden, Haare schulterlang und lockig, Farbe dunkelbraun: Es sollen ca. 5 Std. 25 Min. und ca. 274 € herauskommen.' },
  { id: 's-inhalt-echt', t: 'Inhaltsverzeichnis mit echtem Konto', wie: 'Nach sql/66: Cockpit eines Testkontos → Termine → Leistungen & Regeln → „Inhaltsverzeichnis mit runden Kacheln“ anhaken → „Friseur Damen & Herren“ anhängen → Speichern. Im Formular buchen: Der Termin im Kalender ist so lang wie die ausgerechnete Dauer, die Anfrage zeigt jede Zeile mit Preis.' },
  { id: 's-plattform-eins', t: 'Plattform und Vertrieb auf einer Seite', wie: 'clickzauber-plattform.html mit Schlüssel öffnen (clickzauber-vertrieb.html leitet weiter). Reiter: Überblick, Kunden & Zahlen, Termine, 7-Tage-Demos, Kennzahlen, Potenzielle Kunden, Meldungen, Rundmail, Protokoll. Am Handy die Leiste wischen. Ein Tipp auf ein Konto im Überblick öffnet es unter „Kunden & Zahlen“.' },
  { id: 's-konto-loeschen', t: 'Konto sperren und komplett löschen', wie: 'Kunden & Zahlen → Testkonto antippen → „Komplett sperren“, dann „Wieder freigeben“. Danach „Konto endgültig löschen“ und die E-Mail eintippen: Konto, Team-Zugänge, Formulare, Anfragen, Termine und Netzwerk-Profil sind weg, das Protokoll zeigt „Konto gelöscht“.' },
  { id: 's-wartung', t: 'Wartung: Fenster und Streifen im Cockpit', wie: 'Eigenes Cockpit am Handy offen lassen. Plattform → Überblick → „Wartung starten“. Nach spätestens 20 Sekunden: Fenster „Kurze Wartung“ und roter Streifen oben. „Wartung beenden“ → kurz „Wartung beendet“.' },
  { id: 's-alle-neu-meldung', t: 'Alle Cockpits aktualisieren: mit Rückmeldung', wie: 'Plattform → Überblick → „Alle Cockpits jetzt aktualisieren“. Darunter steht „✓ Ausgelöst … · N Betriebe“, im eigenen Cockpit nach dem Neuladen kurz „Aktualisiert“.' },
  { id: 's-missionen-einmal', t: 'Missionen feiern nur einmal', wie: 'Eine Mission erfüllen, zum Beispiel im Menü „Funktionen“ alle Grundlagen mit „Verstanden“. Danach dasselbe Konto in der App oder an einem zweiten Gerät öffnen: keine zweite Feier, die Mission ist abgehakt.' },
  { id: 's-demo-link', t: '7-Tage-Demo-Link geht auf', wie: 'Nach dem Hochladen von .htaccess, Ordner demo/ und 404.html: Plattform → 7-Tage-Demos → Zugang anlegen → „Per WhatsApp schicken“ an die eigene Nummer → Link am Handy öffnen.' },
  { id: 's-test-online', t: 'Test-Cockpit online', wie: 'clickzauber.de/clickzauber-test-cockpit.html am Handy öffnen. Dort stehen „Neu“ und das Beispiel-Cockpit mit dem hochgeladenen Stand. To-dos und Erkenntnisse gibt es nur hier in der Vorschau.' },
