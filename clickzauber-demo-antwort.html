<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Terminvorschlag — Beispiel</title>
<style>
body{margin:0;background:#faf7f0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#211d16}
a{color:#1f6d4a}a:hover{color:#17503a}
main{max-width:460px;margin:8vh auto;padding:28px;background:#fff;border:1px solid #e6ddca;border-radius:16px;box-sizing:border-box}
@media(max-width:520px){main{margin:0;min-height:100vh;border:0;border-radius:0}}
.k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#1f6d4a}
h1{font-size:22px;margin:8px 0 10px;text-wrap:balance}
p{font-size:16px;line-height:1.6;color:#5f584a;margin:0;text-wrap:pretty}
.kn{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.kn button,.kn a{display:flex;align-items:center;justify-content:center;box-sizing:border-box;width:100%;min-height:56px;padding:14px;border-radius:12px;font:inherit;font-size:17px;font-weight:600;cursor:pointer;text-decoration:none;border:1.5px solid #d9cfbb;background:#fff;color:#211d16}
.kn .ja{border:0;background:#1f6d4a;color:#fff}
.hinweis{margin-top:22px;padding-top:14px;border-top:1px solid #eee5d4;font-size:13.5px;color:#7a7262}
</style>
</head>
<body>
<main id="m"></main>
<script>
/* clickzauber — Kunden-Seite im Beispiel: Antwort auf einen Terminvorschlag.
   Aufruf aus der WhatsApp-Nachricht des Beispiel-Cockpits. Es geht nichts an den Server.
   Die Antwort liegt im Browserspeicher (cz_demo_antwort) und im Link zurück (#antwort-ID-1-ZEIT). */
(function () {
  var q = new URLSearchParams(location.search), id = q.get('id') || '', n = q.get('n') || '', w = q.get('w') || '', br = q.get('br') || 'friseur', z = q.get('z') || '', b = q.get('b') || '';
  var m = document.getElementById('m');
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  var KOPF = b || { friseur: 'Salon am See', catering: 'Seerose Catering', hochzeit: 'Gut Seerose', handwerk: 'Sonnenwerk Nord', beratung: 'Immobilien Weber' }[br] || 'Salon am See', SALON = br === 'friseur';
  function cockpit(ja, ts) { return 'clickzauber-cockpit-live.html?demo=1&branche=' + encodeURIComponent(br) + (z ? '&z=' + encodeURIComponent(z) : '') + '#antwort-' + encodeURIComponent(id) + '-' + (ja ? 1 : 0) + '-' + ts; }
  if (!id) { m.innerHTML = '<div class="k">' + esc(KOPF) + '</div><h1>Dieser Link ist nicht mehr gültig.</h1>'; return; }
  m.innerHTML = '<div class="k">' + esc(KOPF) + '</div><h1>' + esc(w || 'Neuer Terminvorschlag') + '</h1>'
    + '<p>' + (n ? 'Hallo ' + esc(n) + ', p' : 'P') + 'asst Ihnen diese Zeit?</p>'
    + '<div class="kn"><button type="button" class="ja" data-ja="1">Ja, passt</button><button type="button" data-ja="0">Passt nicht</button></div>'
    + '<p class="hinweis">Beispiel: So sieht Ihr Kunde den Vorschlag. Nach dem Tippen bekommt ' + (SALON ? 'der Salon' : 'der Betrieb') + ' sofort eine Push-Nachricht.</p>';
  m.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-ja]'); if (!b) return;
    var ja = b.getAttribute('data-ja') === '1', ts = Date.now();
    try { localStorage.setItem('cz_demo_antwort', JSON.stringify({ id: id, ja: ja, ts: ts })); } catch (x) {}
    m.innerHTML = '<div class="k">' + esc(KOPF) + '</div><h1>' + (ja ? 'Danke, der Termin steht.' : 'Schade.') + '</h1>'
      + '<p>' + (ja ? esc(w) + '. Bis dann!' : (SALON ? 'Der Salon' : 'Der Betrieb') + ' meldet sich mit einer anderen Zeit.') + '</p>'
      + '<div class="kn"><a class="ja" href="' + esc(cockpit(ja, ts)) + '">Zurück zum Cockpit</a></div>'
      + '<p class="hinweis">Im Cockpit kommt jetzt die Push-Nachricht „' + (ja ? 'Vorschlag angenommen' : 'Vorschlag passt nicht') + '“.</p>';
  });
})();
</script>
</body>
</html>
