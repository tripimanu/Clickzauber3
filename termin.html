<style>

body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}

main{max-width:540px;margin:0 auto;padding:26px 20px 56px}
.kopf{display:flex;align-items:center;gap:12px;margin:0 0 26px}

.weg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}

.f{display:flex;flex-direction:column;gap:12px}.f[hidden],[hidden]{display:none!important}
.f label{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:600;color:var(--ink-2)}
.f input,.f textarea{width:100%;min-height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-size:17px;padding:12px 14px;color:var(--ink)}

.f input:focus,.f textarea:focus{outline:none;border-color:var(--accent)}
.go{display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;padding:0 18px;border-radius:14px;border:0;font:inherit;font-size:18px;font-weight:700;color:#fff;background:var(--accent);cursor:pointer;text-decoration:none}
.go:hover{color:#fff;background:var(--accent-2)}.go.dunkel{background:var(--ink)}.go.rot{background:var(--bad)}.go:disabled{opacity:.6;cursor:default}

.hell-k:hover{border-color:var(--accent);color:var(--ink)}
.zur{align-self:center;background:none;border:0;font:inherit;font-size:16px;color:var(--ink-2);text-decoration:underline;cursor:pointer;padding:10px 4px;min-height:44px}
.msg{margin:2px 0 0;font-size:15px;font-weight:600;color:var(--ink-2)}.msg:empty{display:none}.msg.bad{color:var(--bad)}
.wann{background:var(--card);border:1.5px solid var(--accent);border-radius:18px;padding:18px 20px;margin:0 0 18px}
.wann span{display:block;font-size:14px;font-weight:600;color:var(--ink-2)}
.wann b{display:block;font-size:23px;line-height:1.3;margin:2px 0 8px}

.reihe{display:flex;flex-direction:column;gap:10px;margin:0 0 6px}
.demo{background:var(--hell);border-radius:18px;padding:18px 20px;margin:22px 0 0}
.demo b{display:block;font-size:18px;line-height:1.3;margin:0 0 4px}
.demo p{color:var(--ink);margin:0 0 14px}
.so{font-size:15px;margin:20px 0 0}
.klein{font-size:14px;line-height:1.5;color:var(--ink-2);margin:30px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.klein a{color:var(--ink-2)}
.bsp{background:#6f5d33;color:#f7f2e6;font-size:14px;line-height:1.4;text-align:center;padding:10px 16px}

<script>
/* clickzauber — Termin-Link für Interessenten (clickzauber.de/t/CODE, lib/vertrieb-termin.js, sql/64).

(function () {
  var API = 'https://clickzauber-api.vercel.app/api/vertrieb-termin', VON = 'Manuel Tripi', TEL = '+49 176 61398922', WA = '4917661398922', MAIL = 'projekt@clickzauber.de';

  var m = document.getElementById('m'), J = null, WAHL = null, WEG = '';
  var MARK = '<svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="4.4" fill="currentColor"></circle><path d="M16 5.6a10.4 10.4 0 0 1 10.4 10.4" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path><path d="M16 26.4A10.4 10.4 0 0 1 5.6 16" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path></svg>';
  function e(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function woText(j) {

  }
  function ungueltig(t) { zeig('<h1>' + e(t || 'Dieser Link ist nicht mehr gültig.') + '</h1><p>Melden Sie sich gern direkt bei mir, dann finden wir einen Termin.</p>'); }

  /* ── Daten holen und senden (im Beispiel ohne Server) ── */
  function holen() {
    if (BSP) return Promise.resolve(beispiel());

  }
  function senden(d) {
    if (BSP) return Promise.resolve(beispielAntwort(d));
    d.c = C;
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(d) })

  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  var B = null;
  function beispiel() {
    if (!B) {
      var V = [[1, '10:00'], [2, '14:30'], [4, '17:00']].map(function (x, i) { var d = werktag(x[0]); return { datum: iso(d), zeit: x[1], i: i }; });
      V.forEach(function (v) { v.text = lang(v); });

        nachricht: 'Wie besprochen zeige ich Ihnen, wie alle Anfragen für Ihren Food Truck an einer Stelle ankommen.', email: 'sandra.keller@example.de', telefon: '0171 2345678', demo: true, gewaehlt: null, weg: '', wunsch: '', demo_link: '' };

  }
  function icsBeispiel() {

  /* ── Ansichten ── */
  function zeichnen(j) {

  function offen(j, mitWunsch) {
    var vn = vorname(j.name), V = j.vorschlaege || [];
    WEG = WEG || (j.email ? 'mail' : j.telefon ? 'whatsapp' : 'mail');

        + '<div class="weg" role="group" aria-label="Bestätigung"><button type="button" data-weg="mail" aria-pressed="' + (WEG === 'mail') + '">Per E-Mail</button><button type="button" data-weg="whatsapp" aria-pressed="' + (WEG === 'whatsapp') + '">Per WhatsApp</button></div>'
        + '<div class="f"><label id="l-mail"' + (WEG === 'mail' ? '' : ' hidden') + '>Ihre E-Mail-Adresse<input id="i-mail" type="email" inputmode="email" autocomplete="email" maxlength="120" value="' + e(j.email) + '"></label>'

  }
  function fest(j) {

      : (j.mail === false ? 'Die E-Mail ging gerade nicht raus. Ich melde mich bei Ihnen.' : 'Die Bestätigung mit Kalender-Eintrag ist per E-Mail' + (j.email ? ' an ' + e(j.email) : '') + ' unterwegs. Am Vortag kommt eine kurze Erinnerung.');
    var ics = BSP ? icsBeispiel() : API + '?c=' + encodeURIComponent(C) + '&ics=1';
    var h = '<h1>' + (g.vorbei ? 'Unser Gespräch' : 'Danke' + (vn ? ', ' + e(vn) : '') + '. Der Termin steht.') + '</h1>'
      + '<div class="wann"><span>Gespräch mit ' + VON + '</span><b>' + e(g.text) + '</b><p>' + e(j.art_text) + ', etwa ' + (j.dauer || 30) + ' Minuten. ' + e(woText(j)) + '</p></div>'

    if (j.demo_link) h += '<div class="demo"><b>Bis dahin schon ausprobieren</b><p>Ihre eigene clickzauber-Demo für 7 Tage, mit Beispieldaten aus Ihrer Branche. Probieren Sie alles in Ruhe aus, Ihre Fragen besprechen wir dann im Gespräch.</p>'

      + '<div id="anders" hidden><div class="f"><label>Wann würde es Ihnen besser passen?<textarea id="i-wunsch" maxlength="500" placeholder="z. B. nächste Woche Dienstag ab 15 Uhr"></textarea></label><button type="button" class="go dunkel" data-go="anderer">Wunsch senden</button><p class="msg" id="msg2" role="status"></p><button type="button" class="zur" data-zurueck>Zurück</button></div></div>'

  }
  function anderer(j) {

      + ((j.vorschlaege || []).length ? '<div style="display:flex;justify-content:center"><button type="button" class="zur" data-doch>Doch einer der bisherigen Vorschläge?</button></div>' : ''));
  }

  /* ── Klicks ── */
  function meld(id, t, bad) { var x = $(id); if (x) { x.textContent = t || ''; x.className = 'msg' + (bad ? ' bad' : ''); } }
  m.addEventListener('click', function (ev) {
    var b;
    if ((b = ev.target.closest('[data-i]'))) {
      WAHL = +b.getAttribute('data-i');

    if ((b = ev.target.closest('[data-weg]'))) {

    }
